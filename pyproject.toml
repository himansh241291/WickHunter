[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wickhunter"
version = "0.1.0"
description = "Portable long-only liquidity sweep trading research engine"
requires-python = ">=3.11"
dependencies = ["growwapi>=1.5.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wickhunter = "wickhunter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
